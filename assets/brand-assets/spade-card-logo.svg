<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="spadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c5cff"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1012"/>
      <stop offset="100%" style="stop-color:#15181b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Card body -->
  <rect x="10" y="10" width="280" height="400" rx="16" ry="16"
        fill="url(#cardGrad)" stroke="#7c5cff" stroke-width="2" filter="url(#shadow)"/>

  <!-- Inner border -->
  <rect x="20" y="20" width="260" height="380" rx="12" ry="12"
        fill="none" stroke="#3a3d40" stroke-width="1"/>

  <!-- Spade symbol - centered -->
  <g transform="translate(150, 175)" filter="url(#glow)">
    <!-- Spade tip (top point) -->
    <path d="M0,-80 C-15,-60 -30,-30 -30,0 L30,0 C30,-30 15,-60 0,-80 Z"
          fill="url(#spadeGrad)" opacity="0.9"/>
    <!-- Left leaf -->
    <ellipse cx="-25" cy="-25" rx="22" ry="12" fill="url(#spadeGrad)" opacity="0.7" transform="rotate(-20,-25,-25)"/>
    <circle cx="-30" cy="-30" r="4" fill="#ff5c8a" opacity="0.5"/>
    <!-- Right leaf -->
    <ellipse cx="25" cy="-25" rx="22" ry="12" fill="url(#spadeGrad)" opacity="0.7" transform="rotate(20,25,-25)"/>
    <circle cx="30" cy="-30" r="4" fill="#ff5c8a" opacity="0.5"/>
    <!-- Stem -->
    <rect x="-3" y="0" width="6" height="35" rx="2" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Brand name -->
  <text x="150" y="250" font-family="monospace, sans-serif" font-size="22" font-weight="bold"
        fill="#ece6da" letter-spacing="3" text-anchor="middle">TR!FEXTA</text>

  <!-- Accent line -->
  <rect x="90" y="260" width="120" height="2" fill="url(#spadeGrad)" rx="1"/>

  <!-- Sub label -->
  <text x="150" y="280" font-family="monospace, sans-serif" font-size="10"
        fill="#9a948a" letter-spacing="4" text-anchor="middle">· AI ·</text>

  <!-- Corner decorations -->
  <rect x="30" y="30" width="12" height="12" rx="2" fill="none" stroke="#7c5cff" stroke-width="1" opacity="0.4"/>
  <rect x="258" y="30" width="12" height="12" rx="2" fill="none" stroke="#7c5cff" stroke-width="1" opacity="0.4"/>
  <rect x="30" y="378" width="12" height="12" rx="2" fill="none" stroke="#7c5cff" stroke-width="1" opacity="0.4"/>
  <rect x="258" y="378" width="12" height="12" rx="2" fill="none" stroke="#7c5cff" stroke-width="1" opacity="0.4"/>

  <!-- Small spade icon at top-left corner -->
  <g transform="translate(45, 45)" opacity="0.5">
    <path d="M0,-10 C-4,-6 -8,-3 -8,0 L8,0 C8,-3 4,-6 0,-10 Z" fill="#7c5cff"/>
    <ellipse cx="-3" cy="-3" rx="4" ry="2" fill="#7c5cff" opacity="0.5"/>
    <ellipse cx="3" cy="-3" rx="4" ry="2" fill="#7c5cff" opacity="0.5"/>
  </g>

  <!-- Small spade icon at bottom-right corner -->
  <g transform="translate(255, 365) scale(0.6)" opacity="0.5">
    <path d="M0,-10 C-4,-6 -8,-3 -8,0 L8,0 C8,-3 4,-6 0,-10 Z" fill="#7c5cff"/>
    <ellipse cx="-3" cy="-3" rx="4" ry="2" fill="#7c5cff" opacity="0.5"/>
    <ellipse cx="3" cy="-3" rx="4" ry="2" fill="#7c5cff" opacity="0.5"/>
  </g>
</svg>