<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c5cff"/>
      <stop offset="100%" style="stop-color:#ff5c8a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="300" fill="#0a0a0c"/>
  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#7c5cff" stroke-width="0.5">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="200" y1="0" x2="200" y2="300"/><line x1="400" y1="0" x2="400" y2="300"/><line x1="600" y1="0" x2="600" y2="300"/>
  </g>
  <!-- Prism shape -->
  <polygon points="120,150 240,50 240,250" fill="url(#grad)" opacity="0.9" filter="url(#glow)"/>
  <!-- Refraction rays -->
  <line x1="240" y1="80" x2="380" y2="55" stroke="#7c5cff" stroke-width="2.5" opacity="0.6"/>
  <line x1="240" y1="150" x2="380" y2="150" stroke="#38bdf8" stroke-width="2.5" opacity="0.6"/>
  <line x1="240" y1="220" x2="380" y2="245" stroke="#ff5c8a" stroke-width="2.5" opacity="0.6"/>
  <!-- Brand text -->
  <text x="430" y="158" font-family="monospace" font-size="56" font-weight="bold" fill="#ece6da" letter-spacing="8">TR!FEXTA</text>
  <text x="430" y="200" font-family="monospace" font-size="12" fill="#9a948a" letter-spacing="5">INTELLIGENCE · ENGINEERED</text>
  <!-- Icon mark (top-right) -->
  <polygon points="700,130 750,100 750,160" fill="url(#grad)" opacity="0.85"/>
  <polygon points="700,130 730,115 730,145" fill="#0a0a0c"/>
</svg>